services:

  app:
    build: ./app
    container_name: flask-app

    ports:
      - "5000:5000"

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_NAME: devopsdb
      DB_USER: devops
      DB_PASSWORD: password

  db:
    image: mysql:8.4
    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devops
      MYSQL_PASSWORD: password

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

