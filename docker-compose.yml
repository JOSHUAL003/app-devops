services:

 app:
  build: ./app
  container_name: flask-app
  ports:
    - "5000:5000"
  depends_on: [db]
  environment: 
    DB_HOST: db
    DB_USER: root
    DB_PASSWORD: password
    DB_NAME: mydb

 db:
  image: mysql:8.4
  container_name: mysql-db
  environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: mydb
  volumes: 
    - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
